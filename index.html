<script type="module">
/* ═══ TOWER DEFENSE · a Multiplayer Agent starter ═══════════════════════════════════════
 * Build towers together. Hold the path. Co-op, 1–4 players; AI builders fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ the board and path, gold, lives, waves, every tower and enemy type

 *   BOARD ......... the path maths, the ground, trees, the portal and the castle

 *                   AI builders. Only the host runs this and writes shared state.
 *   VIEW .......... turning state into towers, enemies and shots on screen

 *   - The host writes four shared fields: `game` (id, v, phase, wave, lives, gold, timers:

 *     level, builder color), `enemies` (wave + each enemy's progress and hp, ~8/s) and
 *     `bots` (the AI builders' cursors). A new host adopts all four and carries on.
 *   - Each player writes its OWN entity: `cur` (the tile it points at and its tower
 *     type, ~10/s), `n`/`c` (name, color) once and `hb` once a second.
 *   - Players send intents to the host: "build" {x, y, t}, "upgrade" {x, y},
 *     "sell" {x, y}, "go" (start the wave now) and "again" (new game). The host checks
 *     the gold and the tile, then writes the result. Its own clicks apply directly.
 *   - Shots are drawn by every client from the synced towers and enemies; only the
 *     host's shots do damage.
 *   - ?attract plays offline with AI builders only (the preview video is recorded from it).
 *   - Leaderboard "wave-reached": the wave your team reached, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  tile: 2,               // world units per tile
  // The path: tile waypoints joined by straight lines (off the board at both ends).
  path: [[-1, 1], [3, 1], [3, 6], [7, 6], [7, 2], [11, 2], [11, 7], [14, 7]],
  lives: 20,
  startGold: 180,
  firstWaveMs: 15000,    // build time before wave 1
  betweenMs: 9000,       // build time between waves
  resultsMs: 25000,      // the results show this long, then a new game starts
  waveBonus: 25,         // gold for clearing a wave (plus 5 per wave number)
  hpGrowth: 0.3,         // enemy hp grows 30% per wave...
  hpCurve: 0.03,         // ...plus a little more every wave after that
  sellBack: 0.7,         // selling gives back this share of what the tower cost
  seats: 3,              // AI builders fill the team up to this many builders
  botReserve: 60,        // gold the AI builders leave for each human player
  board: "wave-reached",
  // Towers. range in tiles, every = seconds between shots. splash, slow and chain are optional.
  towers: [
    { name: "Archer", cost: 50,  range: 2.6, every: 0.55, dmg: 11, color: "#c98a4b" },
    { name: "Cannon", cost: 90,  range: 2.2, every: 1.5,  dmg: 34, splash: 1.1, color: "#6b7a8c" },
    { name: "Frost",  cost: 70,  range: 2.1, every: 1.0,  dmg: 5,  slow: 0.5, slowFor: 1.6, color: "#5fd3f3" },
    { name: "Spark",  cost: 130, range: 3.1, every: 1.1,  dmg: 26, chain: 2, color: "#b57cff" },
  ],
  upgrade: { cost: [0.8, 1.3], dmg: 1.6, range: 0.35 }, // level 2 and 3: share of the base cost, ×damage, +range
  // Enemies. speed in tiles/s, gap = seconds before the next one spawns, lives = lost on reaching the castle.
  enemies: [
    { name: "Grunt",  hp: 55,   speed: 1.35, gold: 6,  gap: 0.85, size: 0.55, color: "#e2574c" },
    { name: "Runner", hp: 28,   speed: 2.3,  gold: 4,  gap: 0.45, size: 0.42, color: "#f2c14e" },
    { name: "Tank",   hp: 210,  speed: 0.8,  gold: 14, gap: 1.4,  size: 0.8,  color: "#7d5ba6" },
    { name: "Boss",   hp: 1100, speed: 0.6,  gold: 70, gap: 2.0,  size: 1.15, color: "#34405a", lives: 5 },
  ],

/** The enemies of wave n, in spawn order (enemy type numbers). No randomness, so a new host continues it exactly. */

  const out = [], count = Math.min(34, 5 + n * 2);
  for (let i = 0; i < count; i++) {
    let t = 0;
    if (n >= 2 && i % 3 === 1) t = 1;          // runners from wave 2
    if (n >= 4 && i % 5 === 4) t = 2;          // tanks from wave 4
    if (n % 3 === 0 && i >= count - 4) t = 1;  // every third wave ends in a rush
    out.push(t);
  }

const BOT_NAMES = ["Mason", "Tinker", "Rivet", "Gizmo", "Pebble", "Bolt"];
const COLORS = ["#ff5a5a", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'tower-defense',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {

  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),

    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };

}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── BOARD ───────────────────────────────────────────────────────────────────────────
const COLS = CONFIG.cols, ROWS = CONFIG.rows, TL = CONFIG.tile;
const cellX = (cx) => (cx - COLS / 2 + 0.5) * TL, cellZ = (cy) => (cy - ROWS / 2 + 0.5) * TL;
const toCell = (x, z) => ({ cx: Math.floor(x / TL + COLS / 2), cy: Math.floor(z / TL + ROWS / 2) });
const inBoard = (cx, cy) => cx >= 0 && cy >= 0 && cx < COLS && cy < ROWS;
const WP = CONFIG.path.map(([cx, cy]) => ({ x: cellX(cx), z: cellZ(cy) }));
const SEGS = [];
let PATH_LEN = 0; // in tiles
for (let i = 0; i < WP.length - 1; i++) { const a = WP[i], b = WP[i + 1], len = Math.hypot(b.x - a.x, b.z - a.z) / TL; SEGS.push({ a, b, len, from: PATH_LEN }); PATH_LEN += len; }
/** Where something `d` tiles along the path is, and which way it faces. */
function pathPos(d) {
  const s = SEGS.find((s) => d <= s.from + s.len) || SEGS[SEGS.length - 1], f = Math.max(0, Math.min(1, (d - s.from) / s.len));

}
const PATH_CELLS = new Set();
for (let i = 0; i < CONFIG.path.length - 1; i++) {
  let [x, y] = CONFIG.path[i]; const [x2, y2] = CONFIG.path[i + 1];
  for (;;) { if (inBoard(x, y)) PATH_CELLS.add(x + "," + y); if (x === x2 && y === y2) break; x += Math.sign(x2 - x); y += Math.sign(y2 - y); }
}
const SAMPLES = Array.from({ length: Math.ceil(PATH_LEN * 4) }, (_, i) => pathPos(i / 4));
/** How much of the path a tower on (cx, cy) with range r (tiles) can reach: the AI builders' favourite number. */
const coverage = (cx, cy, r) => SAMPLES.filter((p) => Math.hypot(p.x - cellX(cx), p.z - cellZ(cy)) <= r * TL).length;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#a8dcea");
scene.fog = new THREE.Fog("#a8dcea", 70, 150);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 300);
scene.add(new THREE.HemisphereLight("#ffffff", "#5a7a4a", 1.5));
const sun = new THREE.DirectionalLight("#fff1d6", 1.7); sun.position.set(-20, 40, 18); scene.add(sun);
function canvasTex(w, h, paint) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const PX = 64; // ground texture pixels per tile
const groundTex = canvasTex(COLS * PX, ROWS * PX, (c, w, h) => {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { c.fillStyle = (x + y) % 2 ? "#86c95f" : "#7dc057"; c.fillRect(x * PX, y * PX, PX, PX); }
  c.strokeStyle = "#ffffff16"; c.lineWidth = 2; for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) c.strokeRect(x * PX + 2, y * PX + 2, PX - 4, PX - 4);
  const pts = CONFIG.path.map(([x, y]) => [(x + 0.5) * PX, (y + 0.5) * PX]), line = () => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); };

  line(); c.strokeStyle = "#b99a62"; c.lineWidth = PX * 0.98; c.stroke();
  line(); c.strokeStyle = "#ead39f"; c.lineWidth = PX * 0.84; c.stroke();
  const r = mulberry32(3);

});
const board = new THREE.Mesh(new THREE.PlaneGeometry(COLS * TL, ROWS * TL), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
board.rotation.x = -Math.PI / 2; board.position.y = 0.01; scene.add(board);
const dirt = new THREE.MeshStandardMaterial({ color: "#8a5a3b", roughness: 1 }), turf = new THREE.MeshStandardMaterial({ color: "#6fb352", roughness: 1 });
const slab = new THREE.Mesh(new THREE.BoxGeometry((COLS + 3) * TL, 2, (ROWS + 3) * TL), [dirt, dirt, turf, dirt, dirt, dirt]);
slab.position.y = -1; scene.add(slab);
// Trees and rocks on the rim (seeded, so everyone sees the same ones)
const rim = mulberry32(11), trees = new THREE.InstancedMesh(new THREE.ConeGeometry(0.9, 2.4, 7), new THREE.MeshStandardMaterial({ color: "#2f8a3e", flatShading: true }), 40);

const mtx = new THREE.Matrix4(), q0 = new THREE.Quaternion();

const portal = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.35, 10, 28), new THREE.MeshStandardMaterial({ color: "#7a3cff", emissive: "#5a1fd0", emissiveIntensity: 0.8 }));

for (const z of [-1.4, 1.4]) { mesh(new THREE.CylinderGeometry(0.6, 0.7, 3, 8), castleMat, 0, 1.5, z, castle); mesh(new THREE.ConeGeometry(0.85, 1.3, 8), roofMat, 0, 3.6, z, castle); }

  post: new THREE.CylinderGeometry(0.42, 0.55, 1.1, 8), deck: new THREE.BoxGeometry(1.0, 0.18, 1.0),
  stock: new THREE.BoxGeometry(0.18, 0.18, 0.9), bow: new THREE.BoxGeometry(1.0, 0.1, 0.12),
  drum: new THREE.CylinderGeometry(0.62, 0.7, 0.6, 10), ball: new THREE.SphereGeometry(0.42, 14, 10),
  barrel: new THREE.CylinderGeometry(0.17, 0.21, 0.95, 10).rotateX(Math.PI / 2).translate(0, 0, 0.45),
  pillar: new THREE.CylinderGeometry(0.3, 0.45, 1.2, 6), crystal: new THREE.OctahedronGeometry(0.45),

let lastWaveKey = "";
function syncEnemies(dt, g) {
  const { w, list } = enemyList(), amHost = hosting(), age = amHost ? 0 : Math.min(0.5, (performance.now() - (memo.get("enemies")?.at || 0)) / 1000);
  const slowK = 1 - (CONFIG.towers.find((x) => x.slow)?.slow || 0), seen = new Set(), t = Date.now();
  for (const e of list) {
    const key = g.id + "." + w + "." + e.i; seen.add(key);
    let v = eViews.get(key);
    const slowed = amHost ? e.su > t : e.slow, E = CONFIG.enemies[e.t];
    const want = amHost ? e.d : Math.min(PATH_LEN, e.d + E.speed * (slowed ? slowK : 1) * age);
    if (!v) { v = { key, t: e.t, d: want, g: makeEnemy(e.t), max: maxHp(e.t, w) }; eViews.set(key, v); }
    v.d = amHost ? want : v.d + (want - v.d) * Math.min(1, dt * 8);
    v.hp = e.hp; v.ref = amHost ? e : null;
    const p = pathPos(v.d), u = v.g.userData;
    v.x = p.x; v.z = p.z; v.g.position.set(p.x, 0, p.z);
    v.g.rotation.y += Math.atan2(Math.sin(p.h - v.g.rotation.y), Math.cos(p.h - v.g.rotation.y)) * Math.min(1, dt * 10);

/** Every client aims and fires its towers from the synced enemies; only the host's shots do damage. */
function towersTick(dt, g) {
  if (g.phase !== "wave") return;
  const amHost = hosting();
  for (const tw of towerList()) {
    const key = tw[0] + "," + tw[1], left = (cool.get(key) ?? Math.random() * 0.4) - dt;
    if (left > 0) { cool.set(key, left); continue; }
    const st = stats(tw[2], tw[3]), x = cellX(tw[0]), z = cellZ(tw[1]);
    let best = null;
    for (const v of eViews.values()) if (Math.hypot(v.x - x, v.z - z) <= st.range * TL && (!best || v.d > best.d)) best = v;

}
function fire(key, st, target, amHost) {
  const tv = tViews.get(key); if (!tv) return;
  const head = tv.g.userData.head; if (!head.userData.spin) head.rotation.y = Math.atan2(target.x - tv.x, target.z - tv.z);
  const from = new THREE.Vector3(tv.x, tv.g.userData.top, tv.z);
  if (st.chain) { // lightning: instant, jumps to the nearest enemies
    const hit = [target];
    for (let k = 0; k < st.chain; k++) { const a = hit.at(-1); let nx = null, nd = 1.8 * TL; for (const v of eViews.values()) { const d = Math.hypot(v.x - a.x, v.z - a.z); if (!hit.includes(v) && d < nd) { nd = d; nx = v; } } if (!nx) break; hit.push(nx); }
    let a = from;
    for (const h of hit) { const b = new THREE.Vector3(h.x, 0.8, h.z); beam(a, b, st.color); burst(h.x, 0.8, h.z, "#e9d8ff", 6, 3, 0.15); a = b; if (amHost) hurt(h.ref, st.dmg, st); }
    return;

}
function beam(a, b, color) {
  const m = new THREE.Mesh(G.beam, new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.position.copy(a); m.lookAt(b); m.scale.set(1.4, 1.4, a.distanceTo(b)); scene.add(m);

}
function shotsTick(dt) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i]; s.t += dt / s.dur;
    if (s.beam) { s.m.material.opacity = 1 - s.t; if (s.t >= 1) { scene.remove(s.m); s.m.material.dispose(); shots.splice(i, 1); } continue; }

    const k = Math.min(1, s.t), x = s.from.x + (s.tx - s.from.x) * k, z = s.from.z + (s.tz - s.from.z) * k, y = s.from.y + (0.8 - s.from.y) * k + Math.sin(k * Math.PI) * s.arc;

function syncDrones(dt) {

    if (d.fresh) { d.x = o.x; d.z = o.z; d.fresh = false; }
    const k = 1 - Math.pow(0.0005, dt); d.x += (o.x - d.x) * k; d.z += (o.z - d.z) * k;
    d.g.position.set(d.x, 0, d.z); d.d.position.y = 2.6 + Math.sin(performance.now() / 300 + d.x) * 0.15; d.d.rotation.y += dt * 8;

// My cursor: a tile frame, a see-through tower and its range.
const myFrame = new THREE.Mesh(new THREE.PlaneGeometry(TL, TL), new THREE.MeshBasicMaterial({ map: frameTex, transparent: true, depthWrite: false }));
myFrame.rotation.x = -Math.PI / 2; myFrame.position.y = 0.05; scene.add(myFrame);
const myRange = new THREE.Mesh(G.ring, new THREE.MeshBasicMaterial({ color: "#fff", transparent: true, opacity: 0.55, depthWrite: false }));
myRange.rotation.x = -Math.PI / 2; myRange.position.y = 0.06; scene.add(myRange);
const ghost = new THREE.Mesh(G.pillar, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.45 })); scene.add(ghost);
function cursorTick() {
  const show = me.cx >= 0 && inBoard(me.cx, me.cy) && !ATTRACT, tw = show && towerAt(me.cx, me.cy), sel = me.sel && towerList().find((w) => w[0] + "," + w[1] === me.sel);
  myFrame.visible = show; ghost.visible = show && buildable(me.cx, me.cy);
  const g = game(), ok = show && (tw || (buildable(me.cx, me.cy) && g && g.gold >= CONFIG.towers[me.type].cost));
  myFrame.material.color.set(ok ? myColor : "#ff4040"); myFrame.position.set(cellX(me.cx), 0.05, cellZ(me.cy));
  ghost.position.set(cellX(me.cx), 1, cellZ(me.cy)); ghost.material.color.set(CONFIG.towers[me.type].color);

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const myName = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
  ["Brave", "Clever", "Sunny", "Swift", "Lucky", "Mighty"][Math.floor(Math.random() * 6)] + " " + ["Otter", "Fox", "Badger", "Owl", "Panda", "Llama"][Math.floor(Math.random() * 6)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
const me = { cx: -1, cy: -1, type: 0, sel: null, lastSend: 0, sent: "", hintUntil: 0, built: false, lastLives: -1, gameId: -1 };
let boardApi = null, boardFor = -1, toastTimer = 0;
const bar = $("bar");
CONFIG.towers.forEach((T, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<i style="background:${T.color}"></i>${esc(T.name)}<small>● ${T.cost}</small>`;
  b.onclick = () => { me.type = i; me.sel = null; };
  bar.appendChild(b);
});
function toast(text) { $("toast").textContent = text; $("toast").style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").style.opacity = 0), 1400); }
function banner(text) { const b = $("banner"); b.textContent = text; b.style.opacity = 1; setTimeout(() => (b.style.opacity = 0), 1300); }

let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function hud(g) {
  if (ATTRACT) { for (const id of ["stats", "team", "wave", "hint", "net"]) $(id).style.display = "none"; $("net").textContent = ""; bar.hidden = true; return; }
  const t = Date.now(), spec = waveSpec(g.wave), left = spec.length - g.spawned + enemyList().list.length;
  $("sWave").textContent = `Wave ${g.wave}`; $("sLives").textContent = `♥ ${g.lives}`; $("sGold").textContent = `● ${Math.floor(g.gold)}`;
  $("waveTxt").textContent = g.phase === "build" ? `Wave ${g.wave} in ${Math.max(0, Math.ceil((g.nextAt - t) / 1000))}s` : g.phase === "wave" ? `${left} enemies left` : "";
  $("go").hidden = g.phase !== "build";
  [...bar.children].forEach((b, i) => { b.classList.toggle("on", i === me.type && !me.sel); b.classList.toggle("poor", g.gold < CONFIG.towers[i].cost); });
  const sel = me.sel && towerList().find((w) => w[0] + "," + w[1] === me.sel);
  if (me.sel && !sel) me.sel = null;
  $("sel").hidden = !sel;
  if (sel) {
    const c = upCost(sel[2], sel[3]);
    $("selName").textContent = `${CONFIG.towers[sel[2]].name} · Lv ${sel[3]}`;
    $("up").textContent = c ? `Upgrade ● ${c}` : "Max level"; $("up").disabled = !c || g.gold < c;
    $("sell").textContent = `Sell +${refund(sel[2], sel[3])}`;
  }
  const team = humans().map((id) => ({ n: id === net.sessionId ? myName + " (you)" : S.entities.players[id]?.n || "Player", c: id === net.sessionId ? myColor : S.entities.players[id]?.c || "#ccc" }));
  for (const b of botList()) team.push({ n: b.n + " (bot)", c: b.c });
  $("team").innerHTML = team.map((p) => `<div>${esc(p.n)}<i style="background:${esc(p.c)}"></i></div>`).join("");
  const n = humans().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the enemies" : ""}`;
  $("hint").style.opacity = performance.now() < me.hintUntil && !me.built ? 1 : 0;
  $("over").hidden = g.phase !== "over";
  if (g.phase === "over") {

}
function showBoard(wave) {
  const list = $("board");
  if (!boardApi) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  boardApi.submit(wave).catch(() => null).then(() => boardApi.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>wave ${e.score}</span></li>`).join("") : "<li>No scores yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
/** One-off effects when the game changes: a new game, a wave starting or cleared, lives lost. */
function watchGame(g) {

  }
  if (g.lives < me.lastLives) { castleHit = 1; burst(castle.position.x, 2, castle.position.z, "#ff5a5a", 14, 5); pop(castle.position.x, 4.5, castle.position.z, `-${me.lastLives - g.lives} ♥`, "#ff6b6b"); }

let castleHit = 0;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const act = (type, data) => (isHost() ? applyIntent(type, data, net.sessionId) : net.send(type, data));
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function pick(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(ground, hitP) ? toCell(hitP.x, hitP.z) : null; }
function tapTile(cx, cy) {
  const g = game(); if (!g || g.phase === "over") return;
  const tw = towerAt(cx, cy), key = cx + "," + cy;
  if (tw) { me.sel = me.sel === key ? null : key; return; }
  me.sel = null;
  if (!buildable(cx, cy)) return;

}
const cv = renderer.domElement;
cv.addEventListener("pointermove", (e) => { const c = pick(e); if (c) { me.cx = c.cx; me.cy = c.cy; } });
cv.addEventListener("pointerdown", (e) => e.preventDefault());
cv.addEventListener("pointerup", (e) => { const c = pick(e); if (c) { me.cx = c.cx; me.cy = c.cy; tapTile(c.cx, c.cy); } });
$("go").onclick = () => act("go", {});
$("again").onclick = () => act("again", {});
$("up").onclick = () => { const [x, y] = (me.sel || "").split(",").map(Number); if (me.sel) act("upgrade", { x, y }); };
$("sell").onclick = () => { const [x, y] = (me.sel || "").split(",").map(Number); if (me.sel) { act("sell", { x, y }); me.sel = null; } };
addEventListener("keydown", (e) => {
  const i = "1234".indexOf(e.key);
  if (i >= 0 && CONFIG.towers[i]) { me.type = i; me.sel = null; }
  else if (e.key === " ") { e.preventDefault(); act("go", {}); }
  else if (e.key === "u" || e.key === "e") $("up").click();
  else if (e.key === "x" || e.key === "Delete") $("sell").click();
  else if (e.key === "Escape") me.sel = null;

document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
function fit() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
/** Frame the whole board: turned sideways on a tall screen so the long side runs up the phone. */
function placeCamera(now) {
  const tall = innerHeight > innerWidth, elev = ATTRACT ? 0.95 : 1.05, vf = (camera.fov * Math.PI) / 360, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const across = ((tall ? ROWS : COLS) + 2.5) * TL / 2, deep = ((tall ? COLS : ROWS) + 3.5) * TL / 2;
  const dist = Math.max(across / Math.tan(hf), (deep * Math.sin(elev) + 2) / Math.tan(vf)) * (ATTRACT ? 0.62 : 1.05);
  const az = (tall ? Math.PI / 2 : 0) + (ATTRACT ? Math.sin(now / 2600) * 0.25 : 0), look = ATTRACT ? new THREE.Vector3(-3 + Math.sin(now / 3000) * 2.5, 0, 0.5) : new THREE.Vector3(0, 0, tall ? 0 : 1.5);
  camera.position.set(look.x + Math.sin(az) * Math.cos(elev) * dist, Math.sin(elev) * dist, look.z + Math.cos(az) * Math.cos(elev) * dist);
  camera.lookAt(look);
}
/** The room's state can arrive just after we join: if someone (or a bot) already had my color, take a free one. */
function fixMyColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botList();
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.some((b) => b.c === myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...bots.map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.wasHost = false; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixMyColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  placeCamera(now);
  if (g) { watchGame(g); syncTowers(now); syncEnemies(dt, g); towersTick(dt, g); }
  shotsTick(dt); syncDrones(dt); cursorTick(); partsTick(dt); popsTick(dt);
  portal.rotation.z += dt * 1.5; portalCore.material.color.setHSL(0.75, 0.8, 0.08 + Math.sin(now / 200) * 0.04);
  castleHit = Math.max(0, castleHit - dt * 2); castleMat.emissive.setRGB(castleHit, 0, 0);
  const cur = JSON.stringify({ x: me.cx, y: me.cy, t: me.type });
  if (cur !== me.sent && now - me.lastSend > 100) { me.sent = cur; me.lastSend = now; net.me.set("cur", cur); }
  renderer.render(scene, camera);
  if (g && now - lastHud > 150) { lastHud = now; hud(g); }
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { seats: 4, betweenMs: 1500, firstWaveMs: 1000 });
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["build", "upgrade", "sell", "go", "again"]) net.on(type, (m, from) => { if (isHost()) applyIntent(type, m || {}, from); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") boardApi = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  const touch = matchMedia("(pointer: coarse)").matches;
  $("hint").textContent = `Pick a tower below, then ${touch ? "tap" : "click"} a free tile beside the path. The gold is shared with your team.`;
  me.hintUntil = performance.now() + 14000;
  requestAnimationFrame(frame);
})();
</script>
